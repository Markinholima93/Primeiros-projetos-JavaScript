
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lista de Tarefas</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>Lista de Tarefas</h1>
    <p>O objetivo desse projeto é simples: demonstrar conhecimentos iniciais de JavaScripts através
      dessa Lista de Tarefas. Escreva sua tarefa abaixo e aperte Enter. Para remover uma tarefa, 
      clique sobre ela.
    </p>
    <input type="text" id="inputTarefa" placeholder="Digite a sua tarefa">
    <!--<button onclick="adicionarTarefa()">Adicionar Tarefa</button>
    Obs: se tornou redundante com a inserção da função através da 
    tecla Enter-->
    <p id="mensagem"></p>
    <ul id="listaTarefas"></ul>
  </div>

  <script src="script.js"></script>
</body>
</html>
