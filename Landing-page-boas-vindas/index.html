<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Landing Page de Boas Vindas</title>
    <link href="style.css" rel="stylesheet">
</head>

<body>
    <div class="container">
        <h1>Boas vindas, visitante!</h1>
        <p>Esse projeto tem o intuito de desejar as boas vindas personalizadas aos colegas estudantes de JavaScript,
            assim como demonstrar na prática alguns conhecimentos básicos dessa linguagem através dessa página. </p>
        <div class="saudacao" id="mensagemSaudacao">Olá, visitante!</div>
        <input type="text" id="campoNome" placeholder="Digite seu nome, em seguida, aperte o botão">
        <button onClick="mudarNome()">Personalizar Saudação</button>
    </div>
    <script>
        function mudarNome() {
            let nome = document.getElementById("campoNome").value
           
            if (nome !== "") {
                document.getElementById("mensagemSaudacao").textContent = "Olá, " + nome
            } else {
                document.getElementById("mensagemSaudacao").textContent = "Por favor, digite seu nome"
            }
        }

    </script>
</body>

</html>
